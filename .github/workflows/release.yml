# При публикации релиза собирает карточку и прикладывает photoframe-card.js к релизу —
# HACS (категория Dashboard) ставит именно этот файл.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:card
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/photoframe-card.js
