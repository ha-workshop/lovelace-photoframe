name: Validate

on:
  push:
  pull_request:

jobs:
  hacs:
    runs-on: ubuntu-24.04
    steps:
      # 1. Скачиваем репозиторий
      - uses: actions/checkout@v5

      # 2. Настраиваем   Node.js
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Устанавливаем зависимости и собираем карточку в dist/
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:card
      # dist/photoframe-card.js лежит в репозитории для HACS — он должен совпадать с исходниками.
      - name: dist up to date
        run: |
          if ! git diff --exit-code dist/photoframe-card.js; then
            echo "::error::dist/photoframe-card.js is out of date, run npm run build:card"
            exit 1
          fi

      # 4. Запускаем валидацию HACS, когда файл уже готов
      - uses: hacs/action@main
        with:
          category: plugin