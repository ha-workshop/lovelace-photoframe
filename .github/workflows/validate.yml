name: Validate

on:
  push:
  pull_request:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем репозиторий
      - uses: actions/checkout@v4

      # 2. Настраиваем   Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Устанавливаем зависимости и собираем карточку в dist/
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build:card
      # dist/photoframe-card.js лежит в репозитории для HACS — он должен совпадать с исходниками.
      - name: dist up to date
        run: git diff --exit-code dist/photoframe-card.js || (echo "::error::Пересоберите карточку: npm run build:card" && exit 1)

      # 4. Запускаем валидацию HACS, когда файл уже готов
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands